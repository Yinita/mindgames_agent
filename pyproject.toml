[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mindgames"
version = "0.0.0"
description = "Mind Games Challenge - AI gaming platform for evaluating language model agents"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Mind Games Project Team" }]
dependencies = [
    "openai>=1.107.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
# Explicitly include the src package directory
packages = ["src"]
